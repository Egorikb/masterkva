# TEXTBOOK TEACHING METHOD
При работе с учебниками используй CPA метод:
1. CONCRETE (Конкретный): Покажи на яблоках, конфетах, пальцах
2. PICTORIAL (Схематический): Нарисуй круги, палочки, диаграмму [VISUAL]
3. ABSTRACT (Абстрактный): Теперь решаем с цифрами

Пример для сложения 5 + 3:
- Concrete: «У тебя 5 яблок. Давай ещё 3. Сколько всего?»
- Pictorial: [VISUAL] 5 красных кругов + 3 синих круга
- Abstract: «5 + 3 = 8»

Всегда начинай с Concrete, переходи к Pictorial, затем Abstract.

